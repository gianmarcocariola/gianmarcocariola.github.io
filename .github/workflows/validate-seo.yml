name: Validate Jekyll SEO
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build production site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Check generated metadata and sitemap
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from html.parser import HTMLParser
          class Head(HTMLParser):
              def __init__(self):
                  super().__init__(); self.meta={}; self.canonical=[]; self.ld=[]; self.in_ld=False
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='meta': self.meta[a.get('name', a.get('property'))]=a.get('content','')
                  if tag=='link' and a.get('rel')=='canonical': self.canonical.append(a['href'])
                  if tag=='script' and a.get('type')=='application/ld+json': self.in_ld=True
              def handle_endtag(self, tag):
                  if tag=='script': self.in_ld=False
              def handle_data(self, data):
                  if self.in_ld: self.ld.append(data)
          origin='https://gianmarcocariola.github.io'
          descriptions=[]
          for path,url in [('index.html','/'),('research/index.html','/research/'),('cv/index.html','/cv/')]:
              source=(Path('_site')/path).read_text()
              assert '{{' not in source and '{%' not in source
              h=Head(); h.feed(source)
              assert h.canonical==[origin+url], (path,h.canonical)
              assert 'noindex' not in h.meta.get('robots','')
              assert h.meta['og:url']==origin+url
              assert h.meta['og:title'] and h.meta['og:description']
              descriptions.append(h.meta['description'])
              if url=='/':
                  person=json.loads(''.join(h.ld))
                  assert person['@type']=='Person' and person['name']=='Gianmarco Cariola'
              else: assert not h.ld
          assert len(set(descriptions))==3
          error=Head(); error.feed(Path('_site/404.html').read_text())
          assert 'noindex' in error.meta['robots']
          tree=ET.parse('_site/sitemap.xml')
          urls=[n.text for n in tree.findall('.//{*}loc')]
          assert sorted(urls)==sorted(origin+p for p in ['/','/research/','/cv/']), urls
          robots=Path('_site/robots.txt').read_text()
          assert 'Sitemap: '+origin+'/sitemap.xml' in robots and 'Disallow:' not in robots
          print('Production build metadata and sitemap checks passed')
          PY
      - name: Compare visible content with the previous site
        run: |
          mkdir -p /tmp/seo-baseline
          git archive 43184399bd12dd520749b2620770b47ece916e90 | tar -x -C /tmp/seo-baseline
          (cd /tmp/seo-baseline && BUNDLE_GEMFILE="$GITHUB_WORKSPACE/Gemfile" bundle exec jekyll build --destination /tmp/seo-baseline-output)
          python3 - <<'PY'
          from pathlib import Path
          for path in ['index.html','research/index.html','cv/index.html','404.html']:
              old=(Path('/tmp/seo-baseline-output')/path).read_text().split('<body>',1)[1]
              new=(Path('_site')/path).read_text().split('<body>',1)[1]
              assert old==new, path
          for old in Path('/tmp/seo-baseline-output/assets').rglob('*'):
              if old.is_file():
                  new=Path('_site/assets')/old.relative_to('/tmp/seo-baseline-output/assets')
                  assert old.read_bytes()==new.read_bytes(), old
          print('Visible HTML bodies and all assets unchanged')
          PY
      - name: Verify deployed Pages URLs
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import time, urllib.request
          from pathlib import Path
          origin='https://gianmarcocariola.github.io'
          for attempt in range(36):
              try:
                  for url,path in [('/','index.html'),('/research/','research/index.html'),('/cv/','cv/index.html'),('/robots.txt','robots.txt'),('/sitemap.xml','sitemap.xml')]:
                      with urllib.request.urlopen(origin+url,timeout=15) as response:
                          assert response.status==200, url
                          assert 'noindex' not in response.headers.get('X-Robots-Tag','').lower(), url
                          live=response.read().decode()
                          expected=(Path('_site')/path).read_text()
                          assert live==expected, 'Deployment not updated: '+url
                  print('Live HTTP 200, indexing headers and deployed content verified for all five URLs')
                  break
              except Exception as error:
                  print(str(error))
                  if attempt==35: raise
                  time.sleep(5)
          PY
