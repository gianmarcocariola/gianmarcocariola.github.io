title: Gianmarco Cariola
description: Economist at the Bank of Italy. Research in International Trade and Firm Dynamics.
url: "https://gianmarcocariola.github.io"
baseurl: ""
markdown: kramdown
permalink: pretty
cv_pdf: /assets/documents/gianmarco-cariola-cv.pdf
exclude:
  - README.md
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - docs
  - cv/gianmarco-cariola-cv.tex
  - .bundle
  - .gitignore

# Metadata only: visible page content is unchanged.
defaults:
  - scope:
      path: "index.html"
    values:
      description: "Gianmarco Cariola is a research economist at the Bank of Italy, Bologna branch. His research focuses on international trade and firm dynamics."
  - scope:
      path: "research.html"
    values:
      description: "Research by Gianmarco Cariola, economist at the Bank of Italy: publications, working papers and work in progress on international trade and firm dynamics."
  - scope:
      path: "cv.html"
    values:
      description: "Curriculum vitae of Gianmarco Cariola, research economist at the Bank of Italy: appointments, education, research and a downloadable CV."
